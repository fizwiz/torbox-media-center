name: torbox-media-center
services:
    torbox-media-center:
        container_name: torbox-media-center
        stdin_open: true
        tty: true
        restart: always
        volumes:
            - /home/$(whoami)/torbox:/torbox
        environment:
            - TORBOX_API_KEY=<211786e2-0251-4165-9096-2c267f17eed4>
            - MOUNT_METHOD=strm
            - MOUNT_PATH=/torbox
        image: anonymoussystems/torbox-media-center:main
